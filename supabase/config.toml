# Supabase CLI configuration for PERFECT FISHING VR
project_id = "perfect-fishing-vr"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173", "http://localhost:4173"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.fishing-start]
verify_jwt = true
[functions.fishing-complete]
verify_jwt = true
[functions.shop]
verify_jwt = true
[functions.pvp]
verify_jwt = true
