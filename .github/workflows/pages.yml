# Builds the game and publishes it on GitHub Pages (free HTTPS hosting, needed for VR).
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# Then every push to this branch (or Actions -> "Publish game" -> Run workflow) updates the site.
name: Publish game

on:
  push:
    branches: [ccr-6ce01660-93v92u]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
