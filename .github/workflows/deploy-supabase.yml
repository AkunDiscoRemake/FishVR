# Deploys the whole Supabase backend (database migrations + all Edge Functions) in one click.
# GitHub -> Actions -> "Deploy Supabase" -> Run workflow.
# Needs 3 repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  - supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   - the xxxx in https://xxxx.supabase.co
#   SUPABASE_DB_PASSWORD   - database password chosen when the project was created
name: Deploy Supabase

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        # The migrations are idempotent, so this is safe even if the SQL was already run by hand.
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all

      - name: Deploy all Edge Functions
        # Folders starting with "_" (shared code, tests) are skipped automatically.
        run: supabase functions deploy --project-ref "$PROJECT_REF"

      - name: Done
        run: echo "Backend deployed. Functions -> fishing-start, fishing-complete, shop, pvp"
